<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photopea - Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #001a33 0%, #003366 100%);
            color: white;
        }

        .offline-container {
            text-align: center;
            padding: 40px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            max-width: 400px;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2em;
        }

        .icon {
            font-size: 3em;
            margin-bottom: 20px;
        }

        p {
            margin: 15px 0;
            opacity: 0.9;
            line-height: 1.6;
        }

        .status {
            margin-top: 30px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            font-size: 0.9em;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="icon">📶</div>
        <h1>Sem Conexão</h1>
        <p>Você está offline no momento.</p>
        <p>O Photopea requer uma conexão com a internet para funcionar.</p>

        <div class="status">
            <div>
                <div class="spinner"></div>
                Aguardando conexão...
            </div>
        </div>

        <p style="margin-top: 30px; font-size: 0.85em; opacity: 0.7;">
            Reconecte-se e recarregue a página.
        </p>
    </div>

    <script>
        // Verificar conexão a cada 2 segundos
        const checkConnection = () => {
            fetch('https://www.photopea.com', { method: 'HEAD', mode: 'no-cors' })
                .then(() => {
                    location.reload();
                })
                .catch(() => {
                    setTimeout(checkConnection, 2000);
                });
        };

        // Começar a verificar após 2 segundos
        setTimeout(checkConnection, 2000);

        // Verificar quando voltar online
        window.addEventListener('online', () => {
            location.reload();
        });
    </script>
</body>
</html>
